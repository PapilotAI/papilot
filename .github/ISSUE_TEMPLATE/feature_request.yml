name: Feature request
description: Suggest something Papilot should do.
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The paper-writing situation where Papilot falls short today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working.
  - type: textarea
    id: discord
    attributes:
      label: Related Discord post
      description: If this started in Discord, paste the original post link so we can follow up there.
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do instead now?
