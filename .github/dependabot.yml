version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directories:
      - /
      - /engine
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - javascript
    open-pull-requests-limit: 5
    ignore:
      # Papilot targets Node.js >=22.22.0 and tests on Node 22 + 24; keep
      # @types/node aligned with the minimum supported Node major.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
