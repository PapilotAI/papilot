name: Publish APT package

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      PACKAGES_DISPATCH_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable tag to verify or dispatch
        type: string
        required: true

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'PapilotAI/papilot'
    runs-on: ubuntu-latest
    concurrency:
      group: papilot-apt-stable
      queue: max
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      APT_GPG_FINGERPRINT: ${{ vars.APT_GPG_FINGERPRINT }}
    steps:
      - name: Validate release tag and APT configuration
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$APT_GPG_FINGERPRINT" =~ ^[A-F0-9]{40}$ ]]
      - name: Dispatch PapilotAI/apt sync immediately when configured
        env:
          PACKAGES_DISPATCH_TOKEN: ${{ secrets.PACKAGES_DISPATCH_TOKEN }}
        run: |
          if [[ -n "$PACKAGES_DISPATCH_TOKEN" ]]; then
            curl -fsS -X POST \
              -H "Authorization: Bearer $PACKAGES_DISPATCH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/PapilotAI/apt/dispatches \
              -d "{\"event_type\":\"papilot-release\",\"client_payload\":{\"tag\":\"$RELEASE_TAG\"}}"
            echo "Dispatched immediate APT sync for $RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No PACKAGES_DISPATCH_TOKEN configured; PapilotAI/apt will pick up $RELEASE_TAG automatically on its scheduled sync (every 30 minutes)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify live signed APT repository at https://papilot.ai/apt
        run: |
          base="https://papilot.ai/apt"
          curl -fsS --retry 3 "$base/gpg.key" -o /tmp/papilot-apt.key
          fingerprint="$(gpg --batch --with-colons --show-keys /tmp/papilot-apt.key | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$fingerprint" = "$APT_GPG_FINGERPRINT"
          gpg --batch --yes --dearmor --output /tmp/papilot-apt.gpg /tmp/papilot-apt.key
          chmod 644 /tmp/papilot-apt.gpg
          echo "deb [arch=amd64 signed-by=/tmp/papilot-apt.gpg] $base stable main" > /tmp/papilot-apt.list
          apt_source=(-o "Dir::Etc::sourcelist=/tmp/papilot-apt.list" -o 'Dir::Etc::sourceparts=-')
          sudo apt-get "${apt_source[@]}" -o APT::Update::Error-Mode=any update
          candidate="$(apt-cache "${apt_source[@]}" policy papilot-desktop | awk '$1 == "Candidate:" { print $2 }')"
          test -n "$candidate"
          cd "$RUNNER_TEMP"
          apt-get "${apt_source[@]}" download "papilot-desktop=$candidate"
          echo "Verified live signed APT repository at $base (candidate $candidate)." >> "$GITHUB_STEP_SUMMARY"
