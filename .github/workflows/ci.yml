name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vendor/latex-review/package-lock.json
      - run: npm ci
      - run: npm run setup:review
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Checks the generated UI demos and local asset links before main.
      - run: npm run site
      - name: Pack
        run: npm pack --ignore-scripts --dry-run
