name: CI

# Pull requests, main and Release run the checks. A pull request or push to
# main that can change the desktop app also launches it: the unpacked app on
# Apple silicon and Linux, or every installer when a pull request changes the
# installer itself. Desktop Dev (nightly) and Release build and test every
# installer before publishing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # A new push to a pull request replaces its run; any other run has a group of
  # its own, so no commit on main waits or is skipped.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            engine/package-lock.json
      - run: npm ci
      - run: npm run setup:review
      - name: Install TeX for PDF integration tests
        if: matrix.node == 22
        uses: ./.github/actions/setup-tex
      - run: npm run typecheck
      # The runner image already has the libraries Chromium needs. Installing
      # them (--with-deps) needs Ubuntu's package mirror, which the runner
      # sometimes cannot resolve for an hour or more.
      - name: Install browser for PDF review tests
        if: matrix.node == 22
        working-directory: engine
        run: npx playwright install chromium
      - run: npm test
        env:
          # The viewer's lock test drives the built review viewer in Chromium.
          PAPILOT_REVIEW_BROWSER: ${{ matrix.node == 22 && '1' || '' }}
          PAPILOT_BROWSER_CHANNEL: chromium
      - name: PDF diff engine tests
        run: npm --prefix engine test
      - name: PDF review browser tests
        if: matrix.node == 22
        run: npm --prefix engine run test:browser
      - run: npm run i18n -- check
      - run: npm run i18n:check-app
      - run: npm run build
      # Checks the generated UI demos and local asset links before main.
      - run: npm run site
      - name: Verify the static playground without a backend
        # The static pages do not depend on the server's Node version.
        if: matrix.node == 22
        run: |
          engine/node_modules/.bin/playwright install chromium
          node scripts/check-site-blog.mjs
          node scripts/check-site.mjs
          node scripts/check-site-analytics.mjs
          node scripts/check-site-privacy.mjs
          node scripts/check-playground.mjs
        env:
          PAPILOT_BROWSER_CHANNEL: chromium
      - name: Pack
        run: npm pack --ignore-scripts --dry-run

  # Reviewing in the app's real interface, with real LaTeX builds: note
  # review, batched decisions and compilation. A job of its own beside the
  # checks above, so its browser time does not count against theirs.
  review:
    name: Review in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            engine/package-lock.json
      - run: npm ci
      - run: npm run setup:review
      - name: Install TeX
        uses: ./.github/actions/setup-tex
      - name: Install browser
        working-directory: engine
        run: npx playwright install chromium
      - run: npm run build
      # One step each, so one failure does not hide the others' results.
      - name: Review batching
        run: node --import tsx scripts/check-review-batching.mjs
        env:
          PAPILOT_BROWSER_CHANNEL: chromium
      - name: Review application and compilation
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-review-application.mjs
        env:
          PAPILOT_BROWSER_CHANNEL: chromium
      - name: Review flow
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-review-flow.mjs
        env:
          PAPILOT_BROWSER_CHANNEL: chromium
      - name: Note results
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-note-results.mjs
        env:
          PAPILOT_BROWSER_CHANNEL: chromium
      - name: Note options
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-note-options-flow.mjs
        env:
          PAPILOT_BROWSER_CHANNEL: chromium
      - name: Keep screenshots of a failed check
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: review-browser-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Every other interface check, against the real built app with mocked or
  # real services, real LaTeX where a check compiles. One step each, so one
  # failure does not hide the others.
  interface:
    name: Interface checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PAPILOT_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            engine/package-lock.json
      - run: npm ci
      - run: npm run setup:review
      - name: Install TeX
        uses: ./.github/actions/setup-tex
      - name: Install browser
        working-directory: engine
        run: npx playwright install chromium
      - run: npm run build
      - name: ai-review
        run: node --import tsx scripts/check-ai-review.mjs
      - name: appearance
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-appearance.mjs
      - name: attachments
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-attachments.mjs
      - name: build-problems
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-build-problems.mjs
      - name: comparison-progress
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-comparison-progress.mjs
      - name: compilation
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-compilation.mjs
      - name: fast-decisions
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-fast-decisions.mjs
      - name: git-panel
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-git-panel.mjs
      - name: git-workspace
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-git-workspace.mjs
      - name: imports
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-imports.mjs
      - name: locales
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-locales.mjs
      - name: manuscript-source
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-manuscript-source.mjs
      - name: note-groups
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-note-groups.mjs
      - name: note-new-pass
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-note-new-pass.mjs
      - name: note-selection
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-note-selection.mjs
      - name: papers
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-papers.mjs
      - name: pdf-tools
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-pdf-tools.mjs
      - name: pdf-words
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-pdf-words.mjs
      - name: persistent-pdf
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-persistent-pdf.mjs
      - name: places
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-places.mjs
      - name: reply-duplicates
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-reply-duplicates.mjs
      - name: review-notes
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-review-notes.mjs
      - name: review-pdf-appearance
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-review-pdf-appearance.mjs
      - name: review-tools
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-review-tools.mjs
      - name: settings-layout
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-settings-layout.mjs
      - name: skill-library
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-skill-library.mjs
      - name: skills
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-skills.mjs
      - name: source-edit
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-source-edit.mjs
      - name: system-requirements
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-system-requirements.mjs
      - name: task-model
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-task-model.mjs
      - name: task-permissions
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-task-permissions.mjs
      - name: task-preparation
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-task-preparation.mjs
      - name: ui
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-ui.mjs
      - name: unified-review
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-unified-review.mjs
      - name: updates
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-updates.mjs
      - name: workspace-switcher-notes
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-workspace-switcher-notes.mjs
      - name: workspace-switcher
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/check-workspace-switcher.mjs
      - name: Keep screenshots of a failed check
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interface-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The same checks on a native Windows host: the CLI, server and review engine
  # run there too, and the tests that need POSIX signals skip themselves.
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            engine/package-lock.json
      - run: npm ci
      - run: npm run setup:review
      - run: npm run typecheck
      - run: npm test
      - name: PDF diff engine tests
        run: npm --prefix engine test
      - run: npm run build

  # Which desktop check a pull request or a push to main needs, from the files
  # it changes. Release calls CI for a tag and builds every installer itself.
  changes:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.scope.outputs.desktop }}
    steps:
      - uses: actions/checkout@v5
        with:
          # A pull request's merge commit and the base it merges into.
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - id: scope
        env:
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          # A push to main compares with the previous tip (the parent after a force push).
          base=HEAD^1
          if [ -n "$BEFORE" ] && git fetch -q --depth=1 origin "$BEFORE"; then base=$BEFORE; fi
          scope=$(bash scripts/desktop-scope.sh "$base")
          # Main gets the quick check; the nightly Desktop Dev build makes its installers.
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$scope" = installers ]; then scope=quick; fi
          echo "Desktop check: $scope"
          echo "desktop=$scope" >> "$GITHUB_OUTPUT"

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop != 'none'
    uses: ./.github/workflows/desktop.yml
    with:
      quick: ${{ needs.changes.outputs.desktop == 'quick' }}

  # The check to require: it passes when every job above passed or was not needed.
  passed:
    name: CI passed
    if: always()
    needs: [check, review, interface, windows, changes, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Require explicit success from every required job
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          REVIEW_RESULT: ${{ needs.review.result }}
          INTERFACE_RESULT: ${{ needs.interface.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          DESKTOP_SCOPE: ${{ needs.changes.outputs.desktop }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          DESKTOP_VERIFIED: ${{ needs.desktop.outputs.verified }}
        run: bash scripts/ci-passed.sh
