name: Desktop

# Builds the desktop app on native runners and launches it to check that it
# works. It never publishes: CI, Desktop Dev and Release call it. Run workflow
# builds every installer for any branch; the quick option instead checks only
# the unpacked app on Apple silicon, Linux and Windows, like most pull requests.
on:
  workflow_dispatch:
    inputs:
      quick:
        description: Check only the unpacked app on Apple silicon, Linux and Windows
        type: boolean
        default: false
  workflow_call:
    outputs:
      verified:
        description: All requested desktop targets built and launched successfully
        value: ${{ jobs.verified.outputs.result }}
    inputs:
      quick:
        description: Check only the unpacked app on Apple silicon, Linux and Windows
        type: boolean
        default: false
      dev:
        description: Report VERSION-dev.COMMIT, for the Dev channel
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ fromJSON('{"mac-arm64":"macos-15","mac-x64":"macos-15-intel","linux-x64":"ubuntu-22.04","win-x64":"windows-2022"}')[matrix.target] }}
    timeout-minutes: 45
    env:
      # Dev builds: their server and update layer report the commit.
      PAPILOT_DESKTOP_REVISION: ${{ inputs.dev && github.sha || '' }}
    strategy:
      fail-fast: false
      matrix:
        # Intel Macs run the same code on the slowest runner, so quick checks
        # leave them to full builds.
        target: ${{ fromJSON(inputs.quick && '["mac-arm64","linux-x64","win-x64"]' || '["mac-arm64","mac-x64","linux-x64","win-x64"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            engine/package-lock.json
      # Electron and electron-builder fetch their binaries from GitHub releases
      # on every build, and a 504 or reset connection there failed the build.
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-
      # The image has most of the packages the Linux smoke test needs. The rest
      # come from a cache of their .deb files per image, like TeX's, so a run
      # needs Ubuntu's mirror only on a new image: the runners sometimes cannot
      # resolve it for an hour or more.
      - name: Find missing Linux desktop packages
        id: desktop-packages
        if: runner.os == 'Linux'
        run: |
          missing=()
          for package in libgtk-3-0 libnss3 libxss1 libxtst6 libasound2 libgbm1 libnotify4 libsecret-1-0 libfuse2 xvfb xauth openbox; do
            dpkg -s "$package" >/dev/null 2>&1 || missing+=("$package")
          done
          echo "Missing: ${missing[*]:-none}"
          echo "list=${missing[*]}" >> "$GITHUB_OUTPUT"
          echo "dir=/tmp/papilot-desktop-debs" >> "$GITHUB_OUTPUT"
          echo "key=desktop-debs-v1-$ImageOS-$ImageVersion-$(uname -m)-$(sha256sum <<< "${missing[*]}" | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - id: desktop-cache
        if: runner.os == 'Linux' && steps.desktop-packages.outputs.list != ''
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.desktop-packages.outputs.dir }}
          key: ${{ steps.desktop-packages.outputs.key }}
      - name: Install Linux desktop packages from the cache
        id: desktop-cached
        if: steps.desktop-cache.outputs.cache-hit == 'true'
        continue-on-error: true
        env:
          DIR: ${{ steps.desktop-packages.outputs.dir }}
        run: sudo dpkg -i "$DIR"/*.deb
      - name: Install Linux desktop packages from the mirror
        id: desktop-download
        if: steps.desktop-packages.outputs.list != '' && (steps.desktop-cache.outputs.cache-hit != 'true' || steps.desktop-cached.outcome == 'failure')
        env:
          DIR: ${{ steps.desktop-packages.outputs.dir }}
          PACKAGES: ${{ steps.desktop-packages.outputs.list }}
        run: |
          apt=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dir::Cache::archives="$DIR" -o APT::Keep-Downloaded-Packages=true)
          mkdir -p "$DIR/partial" && sudo chown _apt "$DIR/partial"
          sudo apt-get "${apt[@]}" update -qq
          sudo apt-get "${apt[@]}" install -y $PACKAGES
          sudo rm -rf "$DIR/partial" "$DIR/lock"
          sudo chown -R "$(id -u):$(id -g)" "$DIR"
      # Only main saves, as for TeX: pull requests restore its cache.
      - if: github.ref == 'refs/heads/main' && steps.desktop-download.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.desktop-packages.outputs.dir }}
          key: ${{ steps.desktop-packages.outputs.key }}
      - run: npm ci
      # Making the installers takes most of a full build. The smoke tests
      # launch the unpacked app, which --dir builds by itself.
      - name: Build the app${{ !inputs.quick && ' and installers' || '' }}
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run desktop:build${{ inputs.quick && ' -- --dir' || '' }}
      # Papilot's own code for in-place updates of installers with the same
      # shell. The smoke test builds its own copy.
      - name: Build the update layer
        if: ${{ !inputs.quick }}
        run: node scripts/desktop.mjs layer
      - name: Launch the packaged app and check its backend
        if: runner.os == 'macOS'
        timeout-minutes: 10
        env:
          PAPILOT_DESKTOP_EXECUTABLE: ${{ github.workspace }}/release/desktop/${{ matrix.target == 'mac-x64' && 'mac' || 'mac-arm64' }}/Papilot.app/Contents/MacOS/Papilot
        run: npm run test:desktop
      - name: Check Windows paths, commands and process cleanup
        if: runner.os == 'Windows'
        run: node --import tsx --test tests/windows.test.ts tests/wsl.test.ts tests/environment-check.test.ts
      - name: Check environment setup guidance
        if: runner.os == 'Windows'
        env:
          PAPILOT_BROWSER_CHANNEL: msedge
        run: node scripts/check-environment-setup.mjs
      - name: Launch the Windows app and check its backend
        if: runner.os == 'Windows'
        timeout-minutes: 15
        env:
          PAPILOT_DESKTOP_EXECUTABLE: ${{ github.workspace }}/release/desktop/win-unpacked/Papilot.exe
        run: |
          npm run test:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-desktop-environments.mjs
      - name: Test the Linux directory${{ !inputs.quick && ', AppImage and installed deb' || '' }}
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: xvfb-run -a -s '-screen 0 1600x1000x24' bash scripts/check-desktop-linux.sh${{ inputs.quick && ' --dir' || '' }}
      - name: Save installers
        if: ${{ !inputs.quick }}
        uses: actions/upload-artifact@v4
        with:
          name: Papilot-${{ matrix.target }}
          path: |
            release/desktop/*.dmg
            release/desktop/*.zip
            release/desktop/*.AppImage
            release/desktop/*.deb
            release/desktop/*.exe
          if-no-files-found: error
          retention-days: 7
      - name: Save the update layer
        if: ${{ !inputs.quick && matrix.target == 'linux-x64' }}
        uses: actions/upload-artifact@v4
        with:
          name: Papilot-app
          path: |
            release/desktop/papilot-app-*.tgz
            release/desktop/desktop.json
          if-no-files-found: error
          retention-days: 7
      - name: Save desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-check-${{ matrix.target }}
          path: |
            test-results/desktop*.png
            test-results/environment*.png
          if-no-files-found: ignore
          retention-days: 7

  verified:
    if: always()
    needs: build
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.verify.outputs.result }}
    steps:
      - id: verify
        env:
          RESULT: ${{ needs.build.result }}
        run: |
          test "$RESULT" = success
          echo result=success >> "$GITHUB_OUTPUT"
