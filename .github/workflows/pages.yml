name: Pages

on:
  push:
    # The playground shares the app source, so every main update rebuilds it.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    # Give up on a stuck run rather than hold the pages group for six hours.
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      # Render the native UI examples and translated markup at build time.
      - run: node scripts/build-site.mjs
        env:
          PAPILOT_UMAMI_SCRIPT_URL: ${{ vars.PAPILOT_UMAMI_SCRIPT_URL }}
          PAPILOT_UMAMI_WEBSITE_ID: ${{ vars.PAPILOT_UMAMI_WEBSITE_ID }}
          PAPILOT_ANALYTICS_PRIVACY_URL: ${{ vars.PAPILOT_ANALYTICS_PRIVACY_URL }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
