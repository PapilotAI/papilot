name: Release

# Pushing a version tag such as v0.4.0 publishes that version to npm and
# creates its GitHub release from curated release notes when present, otherwise
# from the CHANGELOG. npm trusts this workflow
# (trusted publishing), so no token or one-time code is needed.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # CI's checks on both supported Node versions; a tag pushed without a pull
  # request gets them here.
  ci:
    uses: ./.github/workflows/ci.yml

  desktop:
    uses: ./.github/workflows/desktop.yml
    secrets: inherit

  release:
    # Publish only after CI and every native installer have passed.
    needs: [ci, desktop]
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    permissions:
      contents: write # the GitHub release
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            package-lock.json
            engine/package-lock.json
      - name: Check the tag against package.json and the CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$(node -p 'require("./package.json").version')" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in package.json."; exit 1
          fi
          awk -v heading="## [$version]" 'index($0, heading) == 1 { p = 1; next } /^## \[/ { p = 0 } p' CHANGELOG.md | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::CHANGELOG.md has no [$version] section."; exit 1
          fi
          release_notes="docs/releases/$version/release-notes.md"
          if [ -f "$release_notes" ]; then
            # The versioned introduction may cover an entire minor-release cycle.
            # Omit the heading; the CHANGELOG supplies the release title below.
            sed '1{/^# /d;}' "$release_notes" | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
            if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
              echo "::error::$release_notes is empty."; exit 1
            fi
          else
            printf '```sh\nnpm install -g papilot@latest\n```\n' >> "$RUNNER_TEMP/notes.md"
          fi
          headline="$(awk -v heading="## [$version]" 'index($0, heading) == 1 { separator = " — "; offset = index($0, separator); if (offset) print substr($0, offset + length(separator)); exit }' CHANGELOG.md)"
          title="Papilot $version"
          if [ -n "$headline" ]; then title="$title — $headline"; fi
          printf '%s\n' "$title" > "$RUNNER_TEMP/title.txt"
      - run: npm ci
      - run: npm run setup:review
      - name: Download tested desktop installers
        uses: actions/download-artifact@v4
        with:
          pattern: Papilot-*
          merge-multiple: true
          path: release/desktop
      - name: Require every tested desktop installer and the update layer
        run: |
          version="${GITHUB_REF_NAME#v}"
          for suffix in mac-arm64.dmg mac-arm64.zip mac-x64.dmg mac-x64.zip linux-x86_64.AppImage linux-amd64.deb; do
            test -s "release/desktop/Papilot-$version-$suffix"
          done
          test -s "release/desktop/papilot-app-$version.tgz"
          test "$(node -p 'require("./release/desktop/desktop.json").version')" = "$version"
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      # A rerun after a later step failed finds the version already published.
      - name: Publish to npm
        run: |
          if npm view "$(node -p 'require("./package.json").name')@${GITHUB_REF_NAME#v}" version > /dev/null 2>&1; then
            echo "This version is already on npm."
          else
            npm publish
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "The release already exists."
          else
            gh release create "$GITHUB_REF_NAME" --title "$(cat "$RUNNER_TEMP/title.txt")" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag --latest
          fi

      - name: Attach tested desktop installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          # Apps discover a release by its desktop.json, so it goes last: by
          # then the installers and the update layer it names are uploaded.
          gh release upload "$GITHUB_REF_NAME" release/desktop/*.dmg release/desktop/*.zip release/desktop/*.AppImage release/desktop/*.deb release/desktop/papilot-app-*.tgz --clobber
          gh release upload "$GITHUB_REF_NAME" release/desktop/desktop.json --clobber
