name: Release

# Pushing a version tag such as v0.4.0 publishes that version to npm and
# creates its GitHub release from the CHANGELOG. npm trusts this workflow
# (trusted publishing), so no token or one-time code is needed.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vendor/latex-review/package-lock.json
      - name: Check the tag against package.json and the CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$(node -p 'require("./package.json").version')" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in package.json."; exit 1
          fi
          awk -v heading="## [$version]" 'index($0, heading) == 1 { p = 1; next } /^## \[/ { p = 0 } p' CHANGELOG.md | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::CHANGELOG.md has no [$version] section."; exit 1
          fi
          printf '```sh\nnpm install -g papilot@latest\n```\n' >> "$RUNNER_TEMP/notes.md"
      - run: npm ci
      - run: npm run setup:review
      - run: npm run typecheck
      - run: npm test
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      # A rerun after a later step failed finds the version already published.
      - name: Publish to npm
        run: |
          if npm view "$(node -p 'require("./package.json").name')@${GITHUB_REF_NAME#v}" version > /dev/null 2>&1; then
            echo "This version is already on npm."
          else
            npm publish
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "The release already exists."
          else
            gh release create "$GITHUB_REF_NAME" --title "Papilot ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag --latest
          fi
