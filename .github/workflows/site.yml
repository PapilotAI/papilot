name: Site

on:
  push:
    # The playground shares the app source, so every main update rebuilds it.
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Give up on a stuck run rather than hold the site group for six hours.
    timeout-minutes: 15
    # The environment holds the Cloudflare token and the statistics settings, and only main can use it.
    environment:
      name: website
      url: https://papilot.ai/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Use the latest published release for downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$(gh api repos/PapilotAI/papilot/releases/latest --jq .tag_name)"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The latest published release does not have a stable version tag."; exit 1
          fi
          echo "PAPILOT_SITE_RELEASE=${tag#v}" >> "$GITHUB_ENV"
      # Render the native UI examples and translated markup at build time.
      - run: node scripts/build-site.mjs
        env:
          PAPILOT_UMAMI_SCRIPT_URL: ${{ vars.PAPILOT_UMAMI_SCRIPT_URL }}
          PAPILOT_UMAMI_WEBSITE_ID: ${{ vars.PAPILOT_UMAMI_WEBSITE_ID }}
          PAPILOT_ANALYTICS_PRIVACY_URL: ${{ vars.PAPILOT_ANALYTICS_PRIVACY_URL }}
      # papilot.ai/universe* is served by the PapilotAI/universe Worker, whose more specific route wins.
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.162.0 deploy --config site/wrangler.toml
