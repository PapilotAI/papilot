<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="100 100 824 824" fill="none">
  <title>Papilot Discord server icon</title>
  <desc>The Papilot mark on a full-bleed ice-blue background, without app-icon padding or baked-in rounded corners.</desc>
  <defs>
    <linearGradient id="tile" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop stop-color="#F2F8FF"/>
      <stop offset="0.5" stop-color="#E1EEFD"/>
      <stop offset="1" stop-color="#C9DEF8"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#1B2A5E"/>
      <stop offset="1" stop-color="#28408C"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FF4D5E"/>
      <stop offset="0.65" stop-color="#FF6A64"/>
      <stop offset="1" stop-color="#FF8A70"/>
    </linearGradient>
    <filter id="depth" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="37" stdDeviation="43" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="glow" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#FF5C6C" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" fill="url(#tile)"/>
  <g filter="url(#depth)">
    <g transform="translate(524 500) scale(1.08) rotate(-45)">
      <rect x="-174" y="-229" width="236" height="68" rx="34" fill="url(#navy)"/>
      <rect x="-124" y="-127" width="336" height="68" rx="34" fill="url(#navy)"/>
    </g>
    <g filter="url(#glow)">
      <rect transform="translate(524 500) scale(1.08) rotate(-45)" x="-323" y="-24" width="634" height="48" rx="24" fill="url(#coral)"/>
    </g>
    <g transform="translate(524 500) scale(1.08) rotate(-45)">
      <rect x="-124" y="59" width="336" height="68" rx="34" fill="url(#blue)"/>
      <rect x="-174" y="161" width="236" height="68" rx="34" fill="url(#blue)"/>
    </g>
  </g>
</svg>
