<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 536" role="img" aria-labelledby="title desc"><title id="title">Die KI ändert, Autoren urteilen</title><desc id="desc">Die KI kann Quellcode lokalisieren, Notation anpassen und neu kompilieren; Autoren müssen Prämissen, Notation und Aussagen prüfen und das Werk verantworten.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="200" y="36" font-size="21" fill="var(--art-ink, #171717)" text-anchor="middle">Die KI ändert, Autoren urteilen</text><text x="28" y="91" font-size="22" fill="var(--art-ink, #171717)" >KI-Agent</text><path d="M28 108h344" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="28" y="147" font-size="17" fill="var(--art-ink, #171717)" >1.  Quellcode finden und ändern</text><text x="28" y="186" font-size="17" fill="var(--art-ink, #171717)" >2.  Notation &amp; Referenzen abgleichen</text><text x="28" y="225" font-size="17" fill="var(--art-ink, #171717)" >3.  Manuskript neu kompilieren</text><text x="28" y="297" font-size="22" fill="var(--art-ink, #171717)" >Autor</text><path d="M28 314h344" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="28" y="353" font-size="17" fill="var(--art-ink, #171717)" >1.  Gelten die Prämissen noch?</text><text x="28" y="392" font-size="17" fill="var(--art-ink, #171717)" >2.  Bleibt die Notation konsistent?</text><text x="28" y="431" font-size="17" fill="var(--art-ink, #171717)" >3.  Halten die Aussagen stand?</text><text x="200" y="509" font-size="15" fill="var(--art-muted, #525252)" text-anchor="middle">Sauberer Satz ersetzt kein gültiges Argument.</text></g></svg>
