<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 536" role="img" aria-labelledby="title desc"><title id="title">L'IA modifica, l'autore giudica</title><desc id="desc">L'IA può individuare il codice, aggiornare la notazione e ricompilare; l'autore deve verificare premesse, notazione e tesi, rispondendo del testo finale.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="200" y="36" font-size="21" fill="var(--art-ink, #171717)" text-anchor="middle">L'IA modifica, l'autore giudica</text><text x="28" y="91" font-size="22" fill="var(--art-ink, #171717)" >Agente IA</text><path d="M28 108h344" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="28" y="147" font-size="17" fill="var(--art-ink, #171717)" >1.  Trova e modifica il sorgente</text><text x="28" y="186" font-size="17" fill="var(--art-ink, #171717)" >2.  Allinea notazione e citazioni</text><text x="28" y="225" font-size="17" fill="var(--art-ink, #171717)" >3.  Ricompila il manoscritto</text><text x="28" y="297" font-size="22" fill="var(--art-ink, #171717)" >Autore</text><path d="M28 314h344" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="28" y="353" font-size="17" fill="var(--art-ink, #171717)" >1.  Le premesse valgono ancora?</text><text x="28" y="392" font-size="17" fill="var(--art-ink, #171717)" >2.  La notazione è coerente?</text><text x="28" y="431" font-size="17" fill="var(--art-ink, #171717)" >3.  Le tesi reggono all'esame?</text><text x="200" y="509" font-size="15" fill="var(--art-muted, #525252)" text-anchor="middle">Chiarezza tipografica non significa correttezza logica.</text></g></svg>
