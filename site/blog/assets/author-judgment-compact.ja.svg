<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 536" role="img" aria-labelledby="title desc"><title id="title">修正は AI に、判断は著者に</title><desc id="desc">AI はソースの特定、記法の修正、再コンパイルを行えますが、前提や記法、主張を検証し最終原稿に責任を持つのは著者です。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="200" y="36" font-size="21" fill="var(--art-ink, #171717)" text-anchor="middle">修正は AI に、判断は著者に</text><text x="28" y="91" font-size="22" fill="var(--art-ink, #171717)" >AI エージェント</text><path d="M28 108h344" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="28" y="147" font-size="17" fill="var(--art-ink, #171717)" >1.  ソースの特定と修正</text><text x="28" y="186" font-size="17" fill="var(--art-ink, #171717)" >2.  記法と参照の統一</text><text x="28" y="225" font-size="17" fill="var(--art-ink, #171717)" >3.  原稿の再コンパイル</text><text x="28" y="297" font-size="22" fill="var(--art-ink, #171717)" >著者</text><path d="M28 314h344" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="28" y="353" font-size="17" fill="var(--art-ink, #171717)" >1.  前提は今も成り立つか？</text><text x="28" y="392" font-size="17" fill="var(--art-ink, #171717)" >2.  記法は一貫しているか？</text><text x="28" y="431" font-size="17" fill="var(--art-ink, #171717)" >3.  主張は推敲に耐えるか？</text><text x="200" y="509" font-size="15" fill="var(--art-muted, #525252)" text-anchor="middle">組版の明快さは、論証の正しさを意味しない。</text></g></svg>
