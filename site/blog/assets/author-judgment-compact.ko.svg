<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 536" role="img" aria-labelledby="title desc"><title id="title">수정은 AI에게, 판단은 저자에게</title><desc id="desc">AI는 소스 코드를 찾고 표기를 고치며 다시 컴파일할 수 있지만, 전제와 표기 및 주장을 검증하고 최종 원고에 책임지는 것은 여전히 저자의 몫입니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="200" y="36" font-size="21" fill="var(--art-ink, #171717)" text-anchor="middle">수정은 AI에게, 판단은 저자에게</text><text x="28" y="91" font-size="22" fill="var(--art-ink, #171717)" >AI 에이전트</text><path d="M28 108h344" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="28" y="147" font-size="17" fill="var(--art-ink, #171717)" >1.  소스 코드 탐색 및 수정</text><text x="28" y="186" font-size="17" fill="var(--art-ink, #171717)" >2.  표기 및 인용 조율</text><text x="28" y="225" font-size="17" fill="var(--art-ink, #171717)" >3.  원고 재컴파일</text><text x="28" y="297" font-size="22" fill="var(--art-ink, #171717)" >저자</text><path d="M28 314h344" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="28" y="353" font-size="17" fill="var(--art-ink, #171717)" >1.  전제가 여전히 성립하는가?</text><text x="28" y="392" font-size="17" fill="var(--art-ink, #171717)" >2.  표기가 일관되게 유지되는가?</text><text x="28" y="431" font-size="17" fill="var(--art-ink, #171717)" >3.  주장이 엄밀한 검증을 견디는가?</text><text x="200" y="509" font-size="15" fill="var(--art-muted, #525252)" text-anchor="middle">조판이 깔끔하다고 해서 논증이 올바른 것은 아닙니다.</text></g></svg>
