<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">AI makes the edits; you judge</title><desc id="desc">AI can locate source files, update notation, and recompile, while the author still verifies premises, notation, and claims, taking responsibility for the final manuscript.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="380" y="36" font-size="25" fill="var(--art-ink, #171717)" text-anchor="middle">AI makes the edits; you judge</text><text x="30" y="101" font-size="22" fill="var(--art-ink, #171717)" >AI Agent</text><path d="M30 118h322" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="30" y="157" font-size="18" fill="var(--art-ink, #171717)" >1.  Locate and edit source files</text><text x="30" y="196" font-size="18" fill="var(--art-ink, #171717)" >2.  Align notation and citations</text><text x="30" y="235" font-size="18" fill="var(--art-ink, #171717)" >3.  Recompile the manuscript</text><text x="414" y="101" font-size="22" fill="var(--art-ink, #171717)" >Author</text><path d="M414 118h316" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="414" y="157" font-size="18" fill="var(--art-ink, #171717)" >1.  Do the premises still hold?</text><text x="414" y="196" font-size="18" fill="var(--art-ink, #171717)" >2.  Is the notation consistent?</text><text x="414" y="235" font-size="18" fill="var(--art-ink, #171717)" >3.  Do the claims bear scrutiny?</text><text x="380" y="316" font-size="17" fill="var(--art-muted, #525252)" text-anchor="middle">Clear typesetting does not prove a claim.</text></g></svg>
