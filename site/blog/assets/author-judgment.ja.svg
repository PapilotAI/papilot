<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">修正は AI に、判断は著者に</title><desc id="desc">AI はソースの特定、記法の修正、再コンパイルを行えますが、前提や記法、主張を検証し最終原稿に責任を持つのは著者です。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="380" y="36" font-size="25" fill="var(--art-ink, #171717)" text-anchor="middle">修正は AI に、判断は著者に</text><text x="30" y="101" font-size="22" fill="var(--art-ink, #171717)" >AI エージェント</text><path d="M30 118h322" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="30" y="157" font-size="18" fill="var(--art-ink, #171717)" >1.  ソースの特定と修正</text><text x="30" y="196" font-size="18" fill="var(--art-ink, #171717)" >2.  記法と参照の統一</text><text x="30" y="235" font-size="18" fill="var(--art-ink, #171717)" >3.  原稿の再コンパイル</text><text x="414" y="101" font-size="22" fill="var(--art-ink, #171717)" >著者</text><path d="M414 118h316" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="414" y="157" font-size="18" fill="var(--art-ink, #171717)" >1.  前提は今も成り立つか？</text><text x="414" y="196" font-size="18" fill="var(--art-ink, #171717)" >2.  記法は一貫しているか？</text><text x="414" y="235" font-size="18" fill="var(--art-ink, #171717)" >3.  主張は推敲に耐えるか？</text><text x="380" y="316" font-size="17" fill="var(--art-muted, #525252)" text-anchor="middle">組版の明快さは、論証の正しさを意味しない。</text></g></svg>
