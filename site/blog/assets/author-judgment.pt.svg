<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">Edição com a IA, juízo do autor</title><desc id="desc">A IA pode localizar o código, ajustar a notação e recompilar; cabe ao autor conferir premissas, notação e afirmações, respondendo pelo texto final.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="380" y="36" font-size="25" fill="var(--art-ink, #171717)" text-anchor="middle">Edição com a IA, juízo do autor</text><text x="30" y="101" font-size="22" fill="var(--art-ink, #171717)" >Agente de IA</text><path d="M30 118h322" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="30" y="157" font-size="18" fill="var(--art-ink, #171717)" >1.  Localizar e editar o código</text><text x="30" y="196" font-size="18" fill="var(--art-ink, #171717)" >2.  Alinhar notação e citações</text><text x="30" y="235" font-size="18" fill="var(--art-ink, #171717)" >3.  Recompilar o manuscrito</text><text x="414" y="101" font-size="22" fill="var(--art-ink, #171717)" >Autor</text><path d="M414 118h316" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="414" y="157" font-size="18" fill="var(--art-ink, #171717)" >1.  As premissas ainda valem?</text><text x="414" y="196" font-size="18" fill="var(--art-ink, #171717)" >2.  A notação está consistente?</text><text x="414" y="235" font-size="18" fill="var(--art-ink, #171717)" >3.  As afirmações se sustentam?</text><text x="380" y="316" font-size="17" fill="var(--art-muted, #525252)" text-anchor="middle">Nitidez tipográfica não é rigor lógico.</text></g></svg>
