<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">修改交給 AI，判斷屬於作者</title><desc id="desc">AI 可以定位原始碼、修改記號並重新編譯；作者仍需核對前提、記號與論斷，並為最終稿件負責。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="380" y="36" font-size="25" fill="var(--art-ink, #171717)" text-anchor="middle">修改交給 AI，判斷屬於作者</text><text x="30" y="101" font-size="22" fill="var(--art-ink, #171717)" >AI 代理</text><path d="M30 118h322" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="30" y="157" font-size="18" fill="var(--art-ink, #171717)" >1.  定位與修改原始碼</text><text x="30" y="196" font-size="18" fill="var(--art-ink, #171717)" >2.  協調記號與引用</text><text x="30" y="235" font-size="18" fill="var(--art-ink, #171717)" >3.  重新編譯文稿</text><text x="414" y="101" font-size="22" fill="var(--art-ink, #171717)" >作者</text><path d="M414 118h316" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="414" y="157" font-size="18" fill="var(--art-ink, #171717)" >1.  前提仍然成立嗎？</text><text x="414" y="196" font-size="18" fill="var(--art-ink, #171717)" >2.  記號是否保持一致？</text><text x="414" y="235" font-size="18" fill="var(--art-ink, #171717)" >3.  論斷經得起推敲嗎？</text><text x="380" y="316" font-size="17" fill="var(--art-muted, #525252)" text-anchor="middle">排版的清晰，不等於論證的正確。</text></g></svg>
