<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 650" role="img" aria-labelledby="title desc"><title id="title">対話の重心を原稿へ戻す</title><desc id="desc">左側はソースコードと PDF が分離した作業画面、右側は PDF を主作業領域とし、原稿に直接注釈を付ける画面です。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="200" y="34" font-size="21" fill="var(--art-ink, #171717)" text-anchor="middle">対話の重心を原稿へ戻す</text><rect x="26" y="63" width="348" height="211" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><path d="M26 94h348" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="40" y="84" font-size="14" fill="var(--art-muted, #525252)" >ソース中心</text><path d="M238 94v180" stroke="var(--art-line, #d6d6d6)"/><text x="44" y="122" font-size="17" fill="var(--art-ink, #171717)" >ソースコード</text><text x="250" y="122" font-size="14" fill="var(--art-muted, #525252)" >PDF プレビュー</text><path d="M44 145h166" fill="none" stroke="var(--art-line, #d6d6d6)"/><path d="M54 165h152" fill="none" stroke="var(--art-line, #d6d6d6)"/><path d="M44 185h138" fill="none" stroke="var(--art-line, #d6d6d6)"/><path d="M54 205h166" fill="none" stroke="var(--art-line, #d6d6d6)"/><path d="M44 225h152" fill="none" stroke="var(--art-line, #d6d6d6)"/><rect x="252" y="139" width="108" height="115" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><path d="M261 155h90" fill="none" stroke="var(--art-line, #d6d6d6)"/><path d="M261 172h90" fill="none" stroke="var(--art-line, #d6d6d6)"/><path d="M261 189h90" fill="none" stroke="var(--art-line, #d6d6d6)"/><path d="M261 206h90" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="200" y="302" font-size="17" fill="var(--art-muted, #525252)" text-anchor="middle">PDF → ソースを探す → PDF に戻る</text><rect x="26" y="337" width="348" height="211" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><path d="M26 368h348" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="40" y="358" font-size="14" fill="var(--art-muted, #525252)" >原稿中心</text><text x="44" y="399" font-size="19" fill="var(--art-ink, #171717)" >論文原稿</text><rect x="44" y="418" width="180.95999999999998" height="23" rx="2" fill="var(--art-note, #eff6ff)" stroke="none"/><path d="M44 431h193.44" fill="none" stroke="var(--art-line, #d6d6d6)"/><path d="M44 451h193.44" fill="none" stroke="var(--art-line, #d6d6d6)"/><path d="M44 471h193.44" fill="none" stroke="var(--art-line, #d6d6d6)"/><path d="M44 491h193.44" fill="none" stroke="var(--art-line, #d6d6d6)"/><path d="M44 511h159.12" fill="none" stroke="var(--art-line, #d6d6d6)"/><path d="M235.04000000000002 420v74" stroke="var(--art-accent, #2563eb)"/><text x="246.04000000000002" y="440" font-size="13" fill="var(--art-muted, #525252)" >余白の注釈</text><path d="M246.04000000000002 455h71.76" fill="none" stroke="var(--art-line, #d6d6d6)"/><path d="M246.04000000000002 470h53.040000000000006" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="200" y="579" font-size="18" fill="var(--art-ink, #171717)" text-anchor="middle">読む・注釈する・確認する</text><text x="200" y="617" font-size="16" fill="var(--art-muted, #525252)" text-anchor="middle">AI が裏でローカルの LaTeX ファイルを変更</text></g></svg>
