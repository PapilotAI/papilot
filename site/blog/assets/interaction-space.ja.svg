<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 386" role="img" aria-labelledby="title desc"><title id="title">対話の重心を原稿へ戻す</title><desc id="desc">左側はソースコードと PDF が分離した作業画面、右側は PDF を主作業領域とし、原稿に直接注釈を付ける画面です。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="380" y="36" font-size="25" fill="var(--art-ink, #171717)" text-anchor="middle">対話の重心を原稿へ戻す</text><rect x="24" y="67" width="332" height="220" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><path d="M24 98h332" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="38" y="88" font-size="14" fill="var(--art-muted, #525252)" >ソース中心</text><path d="M227 98v189" stroke="var(--art-line, #d6d6d6)"/><text x="42" y="126" font-size="17" fill="var(--art-ink, #171717)" >ソースコード</text><text x="239" y="126" font-size="14" fill="var(--art-muted, #525252)" >PDF プレビュー</text><path d="M42 149h157" fill="none" stroke="var(--art-line, #d6d6d6)"/><path d="M52 169h143" fill="none" stroke="var(--art-line, #d6d6d6)"/><path d="M42 189h129" fill="none" stroke="var(--art-line, #d6d6d6)"/><path d="M52 209h157" fill="none" stroke="var(--art-line, #d6d6d6)"/><path d="M42 229h143" fill="none" stroke="var(--art-line, #d6d6d6)"/><rect x="241" y="143" width="101" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><path d="M250 159h83" fill="none" stroke="var(--art-line, #d6d6d6)"/><path d="M250 176h83" fill="none" stroke="var(--art-line, #d6d6d6)"/><path d="M250 193h83" fill="none" stroke="var(--art-line, #d6d6d6)"/><path d="M250 210h83" fill="none" stroke="var(--art-line, #d6d6d6)"/><rect x="404" y="67" width="332" height="220" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><path d="M404 98h332" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="418" y="88" font-size="14" fill="var(--art-muted, #525252)" >原稿中心</text><text x="422" y="129" font-size="19" fill="var(--art-ink, #171717)" >論文原稿</text><rect x="422" y="148" width="171.67999999999998" height="23" rx="2" fill="var(--art-note, #eff6ff)" stroke="none"/><path d="M422 161h183.52" fill="none" stroke="var(--art-line, #d6d6d6)"/><path d="M422 181h183.52" fill="none" stroke="var(--art-line, #d6d6d6)"/><path d="M422 201h183.52" fill="none" stroke="var(--art-line, #d6d6d6)"/><path d="M422 221h183.52" fill="none" stroke="var(--art-line, #d6d6d6)"/><path d="M422 241h150.96" fill="none" stroke="var(--art-line, #d6d6d6)"/><path d="M602.32 150v74" stroke="var(--art-accent, #2563eb)"/><text x="613.32" y="170" font-size="13" fill="var(--art-muted, #525252)" >余白の注釈</text><path d="M613.32 185h68.08" fill="none" stroke="var(--art-line, #d6d6d6)"/><path d="M613.32 200h50.32" fill="none" stroke="var(--art-line, #d6d6d6)"/><path d="M368 176h24" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><text x="190" y="319" font-size="17" fill="var(--art-muted, #525252)" text-anchor="middle">PDF → ソースを探す → PDF に戻る</text><text x="570" y="319" font-size="18" fill="var(--art-ink, #171717)" text-anchor="middle">読む・注釈する・確認する</text><text x="570" y="355" font-size="15" fill="var(--art-muted, #525252)" text-anchor="middle">AI が裏でローカルの LaTeX ファイルを変更</text></g></svg>
