<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 386" role="img" aria-labelledby="title desc"><title id="title">對話的重心，回到手稿</title><desc id="desc">左側是原始碼與 PDF 分離的工作區，右側以 PDF 為主工作區，批註直接附著在文稿上。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="380" y="36" font-size="25" fill="var(--art-ink, #171717)" text-anchor="middle">對話的重心，回到手稿</text><rect x="24" y="67" width="332" height="220" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><path d="M24 98h332" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="38" y="88" font-size="14" fill="var(--art-muted, #525252)" >以原始碼為中心</text><path d="M227 98v189" stroke="var(--art-line, #d6d6d6)"/><text x="42" y="126" font-size="17" fill="var(--art-ink, #171717)" >原始碼</text><text x="239" y="126" font-size="14" fill="var(--art-muted, #525252)" >PDF 預覽</text><path d="M42 149h157" fill="none" stroke="var(--art-line, #d6d6d6)"/><path d="M52 169h143" fill="none" stroke="var(--art-line, #d6d6d6)"/><path d="M42 189h129" fill="none" stroke="var(--art-line, #d6d6d6)"/><path d="M52 209h157" fill="none" stroke="var(--art-line, #d6d6d6)"/><path d="M42 229h143" fill="none" stroke="var(--art-line, #d6d6d6)"/><rect x="241" y="143" width="101" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><path d="M250 159h83" fill="none" stroke="var(--art-line, #d6d6d6)"/><path d="M250 176h83" fill="none" stroke="var(--art-line, #d6d6d6)"/><path d="M250 193h83" fill="none" stroke="var(--art-line, #d6d6d6)"/><path d="M250 210h83" fill="none" stroke="var(--art-line, #d6d6d6)"/><rect x="404" y="67" width="332" height="220" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><path d="M