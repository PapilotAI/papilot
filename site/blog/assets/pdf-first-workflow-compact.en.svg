<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 910" role="img" aria-labelledby="title"><title id="title">The page is the workspace.</title><rect width="420" height="910" rx="16" fill="#f7f9fc"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#7090bf" stroke-width="1.6"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif"><text x="26" y="48" font-size="25" fill="#172335">The page is the workspace.</text><text x="26" y="80" font-size="16" fill="#607088">The author makes the decisions.</text>
<rect x="40" y="113" width="352" height="148" rx="10" fill="white" stroke="#adc7ef"/><text x="62" y="143" font-size="12" letter-spacing="1" fill="#2563eb">01 / AUTHOR</text><text x="62" y="183" font-size="25" fill="#172335">Annotate the PDF</text><text x="62" y="214" font-size="17" fill="#607088">Point at what should change.</text>
<path d="M216 270v18" fill="none" stroke="#7090bf" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40" y="297" width="352" height="148" rx="10" fill="white" stroke="#d8dfe8"/><text x="62" y="327" font-size="12" letter-spacing="1" fill="#2563eb">02 / AI AGENT</text><text x="62" y="367" font-size="25" fill="#172335">Edit the LaTeX</text><text x="62" y="398" font-size="17" fill="#607088">Work in ordinary .tex files.</text>
<path d="M216 454v18" fill="none" stroke="#7090bf" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40" y="481" width="352" height="148" rx="10" fill="white" stroke="#d8dfe8"/><text x="62" y="511" font-size="12" letter-spacing="1" fill="#2563eb">03 / PAPILOT</text><text x="62" y="551" font-size="25" fill="#172335">Compile the project</text><text x="62" y="582" font-size="17" fill="#607088">See the typeset result.</text>
<path d="M216 638v18" fill="none" stroke="#7090bf" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40" y="665" width="352" height="148" rx="10" fill="white" stroke="#adc7ef"/><text x="62" y="695" font-size="12" letter-spacing="1" fill="#2563eb">04 / AUTHOR</text><text x="62" y="735" font-size="25" fill="#172335">Review the PDF</text><text x="62" y="766" font-size="17" fill="#607088">Accept, reject, or comment.</text>
<path d="M40 739H17V187h12" fill="none" stroke="#a5b9d6" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<text x="210" y="866" text-anchor="middle" font-size="16" fill="#607088">Another pass, if needed</text></g></svg>
