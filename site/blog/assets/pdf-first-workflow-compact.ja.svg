<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 668" role="img" aria-labelledby="title desc"><title id="title">修正は紙面に始まり、紙面に還る</title><desc id="desc">著者が原稿に注釈を付け、AI がローカルの LaTeX を修正し、Papilot がコンパイルして、著者が PDF 上で確認します。必要に応じて改訂を続けます。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="200" y="36" font-size="23" fill="var(--art-ink, #171717)" text-anchor="middle">修正は紙面に始まり、紙面に還る</text><rect x="42" y="68" width="332" height="113" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="61" y="95" font-size="14" fill="var(--art-muted, #525252)" >01  /  著者</text><text x="61" y="127" font-size="22" fill="var(--art-ink, #171717)" >PDF に注釈</text><text x="61" y="158" font-size="15" fill="var(--art-muted, #525252)" >箇所を示し、修正意図を伝える。</text><path d="M208 193v18" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="42" y="212" width="332" height="113" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="61" y="239" font-size="14" fill="var(--art-muted, #525252)" >02  /  AI エージェント</text><text x="61" y="271" font-size="22" fill="var(--art-ink, #171717)" >LaTeX を編集</text><text x="61" y="302" font-size="15" fill="var(--art-muted, #525252)" >ローカルのソースを特定し修正。</text><path d="M208 337v18" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="42" y="356" width="332" height="113" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="61" y="383" font-size="14" fill="var(--art-muted, #525252)" >03  /  Papilot</text><text x="61" y="415" font-size="22" fill="var(--art-ink, #171717)" >コンパイル</text><text x="61" y="446" font-size="15" fill="var(--art-muted, #525252)" >組版済みの原稿を生成する。</text><path d="M208 481v18" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="42" y="500" width="332" height="113" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="61" y="527" font-size="14" fill="var(--art-muted, #525252)" >04  /  著者</text><text x="61" y="559" font-size="22" fill="var(--art-ink, #171717)" >PDF 上で確認</text><text x="61" y="590" font-size="15" fill="var(--art-muted, #525252)" >承認、却下、または追加コメント。</text><path d="M42 556H18V124h13" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrow)"/><text x="208" y="650" font-size="15" fill="var(--art-muted, #525252)" text-anchor="middle">必要に応じて新たな注釈で改訂を継続</text></g></svg>
