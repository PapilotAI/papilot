<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 668" role="img" aria-labelledby="title desc"><title id="title">Ändringar börjar och slutar på sidan</title><desc id="desc">Författaren kommenterar manuskriptet, AI:n ändrar lokal LaTeX, Papilot kompilerar och författaren granskar på PDF-sidan samt reviderar vidare vid behov.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="200" y="36" font-size="23" fill="var(--art-ink, #171717)" text-anchor="middle">Ändringar börjar och slutar på sidan</text><rect x="42" y="68" width="332" height="113" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="61" y="95" font-size="14" fill="var(--art-muted, #525252)" >01  /  Författare</text><text x="61" y="127" font-size="22" fill="var(--art-ink, #171717)" >Kommentera i PDF:en</text><text x="61" y="158" font-size="15" fill="var(--art-muted, #525252)" >Ange plats och avsedd ändring.</text><path d="M208 193v18" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="42" y="212" width="332" height="113" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="61" y="239" font-size="14" fill="var(--art-muted, #525252)" >02  /  AI-agent</text><text x="61" y="271" font-size="22" fill="var(--art-ink, #171717)" >Redigera LaTeX</text><text x="61" y="302" font-size="15" fill="var(--art-muted, #525252)" >Hitta och ändra lokal källkod.</text><path d="M208 337v18" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="42" y="356" width="332" height="113" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="61" y="383" font-size="14" fill="var(--art-muted, #525252)" >03  /  Papilot</text><text x="61" y="415" font-size="22" fill="var(--art-ink, #171717)" >Kompilera projektet</text><text x="61" y="446" font-size="15" fill="var(--art-muted, #525252)" >Generera det typsatta dokumentet.</text><path d="M208 481v18" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="42" y="500" width="332" height="113" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="61" y="527" font-size="14" fill="var(--art-muted, #525252)" >04  /  Författare</text><text x="61" y="559" font-size="22" fill="var(--art-ink, #171717)" >Granska i PDF:en</text><text x="61" y="590" font-size="15" fill="var(--art-muted, #525252)" >Godta, avvisa eller kommentera.</text><path d="M42 556H18V124h13" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrow)"/><text x="208" y="650" font-size="15" fill="var(--art-muted, #525252)" text-anchor="middle">Fortsätt med nya kommentarer vid behov</text></g></svg>
