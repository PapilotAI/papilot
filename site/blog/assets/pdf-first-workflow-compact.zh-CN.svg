<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 910" role="img" aria-labelledby="title"><title id="title">让页面成为工作台。</title><rect width="420" height="910" rx="16" fill="#f7f9fc"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#7090bf" stroke-width="1.6"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif"><text x="26" y="48" font-size="25" fill="#172335">让页面成为工作台。</text><text x="26" y="80" font-size="16" fill="#607088">每一轮修改，由作者做出判断。</text>
<rect x="40" y="113" width="352" height="148" rx="10" fill="white" stroke="#adc7ef"/><text x="62" y="143" font-size="12" letter-spacing="1" fill="#2563eb">01 / 作者</text><text x="62" y="183" font-size="25" fill="#172335">在 PDF 上批注</text><text x="62" y="214" font-size="17" fill="#607088">指出哪一处需要修改。</text>
<path d="M216 270v18" fill="none" stroke="#7090bf" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40" y="297" width="352" height="148" rx="10" fill="white" stroke="#d8dfe8"/><text x="62" y="327" font-size="12" letter-spacing="1" fill="#2563eb">02 / AI 智能体</text><text x="62" y="367" font-size="25" fill="#172335">编辑 LaTeX</text><text x="62" y="398" font-size="17" fill="#607088">在标准 .tex 文件中修改。</text>
<path d="M216 454v18" fill="none" stroke="#7090bf" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40" y="481" width="352" height="148" rx="10" fill="white" stroke="#d8dfe8"/><text x="62" y="511" font-size="12" letter-spacing="1" fill="#2563eb">03 / PAPILOT</text><text x="62" y="551" font-size="25" fill="#172335">编译项目</text><text x="62" y="582" font-size="17" fill="#607088">得到实际排版后的结果。</text>
<path d="M216 638v18" fill="none" stroke="#7090bf" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40" y="665" width="352" height="148" rx="10" fill="white" stroke="#adc7ef"/><text x="62" y="695" font-size="12" letter-spacing="1" fill="#2563eb">04 / 作者</text><text x="62" y="735" font-size="25" fill="#172335">审阅 PDF</text><text x="62" y="766" font-size="17" fill="#607088">接受、拒绝，或继续评论。</text>
<path d="M40 739H17V187h12" fill="none" stroke="#a5b9d6" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<text x="210" y="866" text-anchor="middle" font-size="16" fill="#607088">需要时，再修改一轮</text></g></svg>
