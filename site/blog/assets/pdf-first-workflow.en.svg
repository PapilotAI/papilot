<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" role="img" aria-labelledby="title desc"><title id="title">The page is the workspace.</title><desc id="desc">One revision loop. The author makes the decisions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#7090bf" stroke-width="1.6"/></marker></defs><rect width="760" height="650" rx="18" fill="#f7f9fc"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif"><text x="44" y="65" font-size="31" fill="#172335">The page is the workspace.</text><text x="44" y="98" font-size="17" fill="#607088">One revision loop. The author makes the decisions.</text>
