<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 444" role="img" aria-labelledby="title desc"><title id="title">修正は紙面に始まり、紙面に還る</title><desc id="desc">著者が原稿に注釈を付け、AI がローカルの LaTeX を修正し、Papilot がコンパイルして、著者が PDF 上で確認します。必要に応じて改訂を続けます。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="380" y="36" font-size="25" fill="var(--art-ink, #171717)" text-anchor="middle">修正は紙面に始まり、紙面に還る</text><rect x="30" y="73" width="300" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="49" y="100" font-size="14" fill="var(--art-muted, #525252)" >01  /  著者</text><text x="49" y="132" font-size="22" fill="var(--art-ink, #171717)" >PDF に注釈</text><text x="49" y="163" font-size="16" fill="var(--art-muted, #525252)" >箇所を示し、修正意図を伝える。</text><rect x="430" y="73" width="300" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="449" y="100" font-size="14" fill="var(--art-muted, #525252)" >02  /  AI エージェント</text><text x="449" y="132" font-size="22" fill="var(--art-ink, #171717)" >LaTeX を編集</text><text x="449" y="163" font-size="16" fill="var(--art-muted, #525252)" >ローカルのソースを特定し修正。</text><rect x="430" y="271" width="300" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="449" y="298" font-size="14" fill="var(--art-muted, #525252)" >03  /  Papilot</text><text x="449" y="330" font-size="22" fill="var(--art-ink, #171717)" >コンパイル</text><text x="449" y="361" font-size="16" fill="var(--art-muted, #525252)" >組版済みの原稿を生成する。</text><rect x="30" y="271" width="300" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="49" y="298" font-size="14" fill="var(--art-muted, #525252)" >04  /  著者</text><text x="49" y="330" font-size="22" fill="var(--art-ink, #171717)" >PDF 上で確認</text><text x="49" y="361" font-size="16" fill="var(--art-muted, #525252)" >承認、却下、または追加コメント。</text><path d="M344 135h72" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M580 211v46" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M416 333h-72" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M180 257v-46" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrow)"/><text x="380" y="433" font-size="16" fill="var(--art-muted, #525252)" text-anchor="middle">必要に応じて新たな注釈で改訂を継続</text></g></svg>
