<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 444" role="img" aria-labelledby="title desc"><title id="title">페이지에서 페이지로</title><desc id="desc">저자가 원고에 주석을 달면 AI가 로컬 LaTeX를 수정하고, Papilot이 컴파일한 뒤 저자가 다시 PDF 위에서 검토하며 필요시 수정을 이어갑니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="380" y="36" font-size="25" fill="var(--art-ink, #171717)" text-anchor="middle">페이지에서 페이지로</text><rect x="30" y="73" width="300" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="49" y="100" font-size="14" fill="var(--art-muted, #525252)" >01  /  저자</text><text x="49" y="132" font-size="22" fill="var(--art-ink, #171717)" >PDF에 주석 달기</text><text x="49" y="163" font-size="16" fill="var(--art-muted, #525252)" >위치와 수정 의도를 적습니다.</text><rect x="430" y="73" width="300" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="449" y="100" font-size="14" fill="var(--art-muted, #525252)" >02  /  AI 에이전트</text><text x="449" y="132" font-size="22" fill="var(--art-ink, #171717)" >LaTeX 편집</text><text x="449" y="163" font-size="16" fill="var(--art-muted, #525252)" >로컬 소스를 찾아 수정합니다.</text><rect x="430" y="271" width="300" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="449" y="298" font-size="14" fill="var(--art-muted, #525252)" >03  /  Papilot</text><text x="449" y="330" font-size="22" fill="var(--art-ink, #171717)" >프로젝트 컴파일</text><text x="449" y="361" font-size="16" fill="var(--art-muted, #525252)" >조판된 새 원고를 생성합니다.</text><rect x="30" y="271" width="300" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="49" y="298" font-size="14" fill="var(--art-muted, #525252)" >04  /  저자</text><text x="49" y="330" font-size="22" fill="var(--art-ink, #171717)" >PDF에서 검토</text><text x="49" y="361" font-size="16" fill="var(--art-muted, #525252)" >수락, 거절 또는 추가 주석.</text><path d="M344 135h72" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M580 211v46" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M416 333h-72" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M180 257v-46" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrow)"/><text x="380" y="433" font-size="16" fill="var(--art-muted, #525252)" text-anchor="middle">필요할 때 새로운 주석으로 이어가기</text></g></svg>
