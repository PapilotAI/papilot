<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 444" role="img" aria-labelledby="title desc"><title id="title">Ändringar börjar och slutar på sidan</title><desc id="desc">Författaren kommenterar manuskriptet, AI:n ändrar lokal LaTeX, Papilot kompilerar och författaren granskar på PDF-sidan samt reviderar vidare vid behov.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="380" y="36" font-size="25" fill="var(--art-ink, #171717)" text-anchor="middle">Ändringar börjar och slutar på sidan</text><rect x="30" y="73" width="300" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="49" y="100" font-size="14" fill="var(--art-muted, #525252)" >01  /  Författare</text><text x="49" y="132" font-size="22" fill="var(--art-ink, #171717)" >Kommentera i PDF:en</text><text x="49" y="163" font-size="16" fill="var(--art-muted, #525252)" >Ange plats och avsedd ändring.</text><rect x="430" y="73" width="300" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="449" y="100" font-size="14" fill="var(--art-muted, #525252)" >02  /  AI-agent</text><text x="449" y="132" font-size="22" fill="var(--art-ink, #171717)" >Redigera LaTeX</text><text x="449" y="163" font-size="16" fill="var(--art-muted, #525252)" >Hitta och ändra lokal källkod.</text><rect x="430" y="271" width="300" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="449" y="298" font-size="14" fill="var(--art-muted, #525252)" >03  /  Papilot</text><text x="449" y="330" font-size="22" fill="var(--art-ink, #171717)" >Kompilera projektet</text><text x="449" y="361" font-size="16" fill="var(--art-muted, #525252)" >Generera det typsatta dokumentet.</text><rect x="30" y="271" width="300" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="49" y="298" font-size="14" fill="var(--art-muted, #525252)" >04  /  Författare</text><text x="49" y="330" font-size="22" fill="var(--art-ink, #171717)" >Granska i PDF:en</text><text x="49" y="361" font-size="16" fill="var(--art-muted, #525252)" >Godta, avvisa eller kommentera.</text><path d="M344 135h72" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M580 211v46" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M416 333h-72" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M180 257v-46" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrow)"/><text x="380" y="433" font-size="16" fill="var(--art-muted, #525252)" text-anchor="middle">Fortsätt med nya kommentarer vid behov</text></g></svg>
