<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 444" role="img" aria-labelledby="title desc"><title id="title">修改始于页面，也归于页面</title><desc id="desc">作者批注文稿，AI 修改本地 LaTeX，Papilot 编译，再由作者在 PDF 上审阅；需要时继续修订。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="380" y="36" font-size="25" fill="var(--art-ink, #171717)" text-anchor="middle">修改始于页面，也归于页面</text><rect x="30" y="73" width="300" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="49" y="100" font-size="14" fill="var(--art-muted, #525252)" >01  /  作者</text><text x="49" y="132" font-size="22" fill="var(--art-ink, #171717)" >在 PDF 上批注</text><text x="49" y="163" font-size="16" fill="var(--art-muted, #525252)" >指明位置，说明修改意图。</text><rect x="430" y="73" width="300" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="449" y="100" font-size="14" fill="var(--art-muted, #525252)" >02  /  AI 智能体</text><text x="449" y="132" font-size="22" fill="var(--art-ink, #171717)" >编辑 LaTeX</text><text x="449" y="163" font-size="16" fill="var(--art-muted, #525252)" >定位并修改本地源码。</text><rect x="430" y="271" width="300" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="449" y="298" font-size="14" fill="var(--art-muted, #525252)" >03  /  Papilot</text><text x="449" y="330" font-size="22" fill="var(--art-ink, #171717)" >编译项目</text><text x="449" y="361" font-size="16" fill="var(--art-muted, #525252)" >生成实际排版后的文稿。</text><rect x="30" y="271" width="300" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="49" y="298" font-size="14" fill="var(--art-muted, #525252)" >04  /  作者</text><text x="49" y="330" font-size="22" fill="var(--art-ink, #171717)" >在 PDF 上审阅</text><text x="49" y="361" font-size="16" fill="var(--art-muted, #525252)" >接受、拒绝，或继续评论。</text><path d="M344 135h72" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M580 211v46" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M416 333h-72" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M180 257v-46" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrow)"/><text x="380" y="433" font-size="16" fill="var(--art-muted, #525252)" text-anchor="middle">需要时，带着新的批注继续</text></g></svg>
